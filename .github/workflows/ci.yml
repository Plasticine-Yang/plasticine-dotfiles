name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-14
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CHEZMOI_VERSION: 2.72.1
      SHELLCHECK_VERSION: 0.11.0

    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends expect zsh
          else
            command -v expect >/dev/null
          fi
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64)
              chezmoi_asset=chezmoi-linux-amd64
              shellcheck_platform=linux.x86_64
              shellcheck_sha=8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
              ;;
            Darwin-x86_64)
              chezmoi_asset=chezmoi-darwin-amd64
              shellcheck_platform=darwin.x86_64
              shellcheck_sha=3c89db4edcab7cf1c27bff178882e0f6f27f7afdf54e859fa041fca10febe4c6
              ;;
            Darwin-arm64)
              chezmoi_asset=chezmoi-darwin-arm64
              shellcheck_platform=darwin.aarch64
              shellcheck_sha=56affdd8de5527894dca6dc3d7e0a99a873b0f004d7aabc30ae407d3f48b0a79
              ;;
            *) echo 'Unsupported CI runner architecture.' >&2; exit 1 ;;
          esac

          release_url=https://github.com/twpayne/chezmoi/releases/download/v${CHEZMOI_VERSION}
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/chezmoi-download"
          cd "$RUNNER_TEMP/chezmoi-download"
          curl --proto '=https' --proto-redir '=https' -fsSLO \
            "$release_url/$chezmoi_asset"
          curl --proto '=https' --proto-redir '=https' -fsSLO \
            "$release_url/chezmoi_${CHEZMOI_VERSION}_checksums.txt"
          grep "  $chezmoi_asset\$" "chezmoi_${CHEZMOI_VERSION}_checksums.txt" \
            > selected-checksum.txt
          shasum -a 256 -c selected-checksum.txt
          install -m 755 "$chezmoi_asset" "$RUNNER_TEMP/bin/chezmoi"

          shellcheck_asset=shellcheck-v${SHELLCHECK_VERSION}.${shellcheck_platform}.tar.xz
          curl --proto '=https' --proto-redir '=https' -fsSLO \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/$shellcheck_asset"
          printf '%s  %s\n' "$shellcheck_sha" "$shellcheck_asset" > shellcheck-checksum.txt
          shasum -a 256 -c shellcheck-checksum.txt
          tar -xJf "$shellcheck_asset"
          install -m 755 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck" \
            "$RUNNER_TEMP/bin/shellcheck"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Verify required tools
        shell: bash
        run: |
          set -euo pipefail
          command -v chezmoi shellcheck zsh expect
          chezmoi --version
          shellcheck --version
          zsh --version

      - name: Check the working tree
        run: git diff --check

      - name: Run integration tests
        run: CHEZMOI_BIN=chezmoi ./tests/integration.sh

      - name: Run installer tests
        run: CHEZMOI_BIN=chezmoi ./tests/installer.sh

      - name: Run shell tests
        run: CHEZMOI_BIN=chezmoi ./tests/shell.sh

      - name: Run shell runtime tests
        run: ./tests/shell-runtime.sh

      - name: Run release pipeline tests
        run: CHEZMOI_BIN=chezmoi ./tests/release.sh
