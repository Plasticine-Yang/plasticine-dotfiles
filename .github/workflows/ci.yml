name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-14
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CHEZMOI_VERSION: 2.72.1
      SHELLCHECK_VERSION: 0.11.0

    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends expect neovim zsh
          else
            command -v expect >/dev/null
            brew install neovim
          fi
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64)
              chezmoi_asset=chezmoi-linux-amd64
              shellcheck_platform=linux.x86_64
              shellcheck_sha=8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
              ;;
            Darwin-x86_64)
              chezmoi_asset=chezmoi-darwin-amd64
              shellcheck_platform=darwin.x86_64
              shellcheck_sha=3c89db4edcab7cf1c27bff178882e0f6f27f7afdf54e859fa041fca10febe4c6
              ;;
            Darwin-arm64)
              chezmoi_asset=chezmoi-darwin-arm64
              shellcheck_platform=darwin.aarch64
              shellcheck_sha=56affdd8de5527894dca6dc3d7e0a99a873b0f004d7aabc30ae407d3f48b0a79
              ;;
            *) echo 'Unsupported CI runner architecture.' >&2; exit 1 ;;
          esac

          release_url=https://github.com/twpayne/chezmoi/releases/download/v${CHEZMOI_VERSION}
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/chezmoi-download"
          cd "$RUNNER_TEMP/chezmoi-download"
          curl --proto '=https' --proto-redir '=https' -fsSLO \
            "$release_url/$chezmoi_asset"
          curl --proto '=https' --proto-redir '=https' -fsSLO \
            "$release_url/chezmoi_${CHEZMOI_VERSION}_checksums.txt"
          grep "  $chezmoi_asset\$" "chezmoi_${CHEZMOI_VERSION}_checksums.txt" \
            > selected-checksum.txt
          shasum -a 256 -c selected-checksum.txt
          install -m 755 "$chezmoi_asset" "$RUNNER_TEMP/bin/chezmoi"

          shellcheck_asset=shellcheck-v${SHELLCHECK_VERSION}.${shellcheck_platform}.tar.xz
          curl --proto '=https' --proto-redir '=https' -fsSLO \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/$shellcheck_asset"
          printf '%s  %s\n' "$shellcheck_sha" "$shellcheck_asset" > shellcheck-checksum.txt
          shasum -a 256 -c shellcheck-checksum.txt
          tar -xJf "$shellcheck_asset"
          install -m 755 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck" \
            "$RUNNER_TEMP/bin/shellcheck"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Verify required tools
        shell: bash
        run: |
          set -euo pipefail
          command -v chezmoi shellcheck nvim zsh expect
          chezmoi --version
          shellcheck --version
          zsh --version

      - name: Check the working tree
        run: git diff --check

      - name: Run integration tests
        run: CHEZMOI_BIN=chezmoi ./tests/integration.sh

      - name: Run combined installation tests
        run: CHEZMOI_BIN=chezmoi ./tests/combined-installation.sh

      - name: Run chezmoi bootstrap tests
        run: CHEZMOI_BIN=chezmoi ./tests/chezmoi.sh

      - name: Run Git configuration tests
        run: CHEZMOI_BIN=chezmoi ./tests/git-config.sh

      - name: Run installer tests
        run: CHEZMOI_BIN=chezmoi ./tests/installer.sh

      - name: Run shell tests
        run: CHEZMOI_BIN=chezmoi ./tests/shell.sh

      - name: Run shell runtime tests
        run: ./tests/shell-runtime.sh

      - name: Run Lazygit tests
        run: CHEZMOI_BIN=chezmoi ./tests/lazygit.sh

      - name: Run Lazygit runtime tests
        run: CHEZMOI_BIN=chezmoi ./tests/lazygit-runtime.sh

      - name: Run fnm tests
        run: CHEZMOI_BIN=chezmoi ./tests/fnm.sh

      - name: Run fnm runtime tests
        run: ./tests/fnm-runtime.sh

      - name: Run Neovim tests
        run: CHEZMOI_BIN=chezmoi ./tests/neovim.sh

      - name: Run Neovim runtime tests
        run: ./tests/neovim-runtime.sh

      - name: Run Herdr tests
        run: CHEZMOI_BIN=chezmoi ./tests/herdr.sh

      - name: Run release pipeline tests
        run: CHEZMOI_BIN=chezmoi ./tests/release.sh

  debian-shell:
    name: Debian 12 shell (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    container: debian:12-slim
    timeout-minutes: 25
    steps:
      - name: Install Debian test prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl expect git libdigest-sha-perl openssh-client sudo
          useradd --create-home --shell /usr/bin/zsh tester
          printf '%s\n' 'tester ALL=(root) NOPASSWD: /usr/bin/apt-get update, /usr/bin/apt-get install -y --no-upgrade zsh' > /etc/sudoers.d/plasticine-test
          chmod 440 /etc/sudoers.d/plasticine-test
          visudo -cf /etc/sudoers.d/plasticine-test

      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Prepare an unprivileged source checkout
        run: |
          cp -R . /home/tester/source
          chown -R tester:tester /home/tester/source

      - name: Smoke the native Debian shell installation
        run: |
          runuser -u tester -- sh -eu <<'EOF'
          export HOME=/home/tester
          cd "$HOME/source"
          git switch -c debian-shell-smoke
          git add -A
          git -c user.name=test -c user.email=test@example.com commit --allow-empty -qm smoke-source
          export PLASTICINE_DOTFILES_REPO_URL=$HOME/source
          export PLASTICINE_SHELL_TTY=0
          test ! -e /usr/bin/zsh
          ./install.sh -y --shell
          test -x /usr/bin/zsh
          test "$(getent passwd "$(id -u)" | cut -d: -f7)" = /usr/bin/zsh
          export PATH=$HOME/.local/bin:$PATH
          zsh --version
          zsh -ic '(( $+functions[antidote] && $+functions[p10k] && $+functions[compdef] ))' > "$HOME/startup.out" 2> "$HOME/startup.err"
          if grep -F 'plasticine:' "$HOME/startup.err"; then
            cat "$HOME/startup.err"
            exit 1
          fi
          sha256sum "$HOME/.zshrc" "$HOME/.zsh_plugins.txt" "$HOME/.p10k.zsh" "$HOME/.plasticine/zsh/shared.zsh" > "$HOME/before.sha256"
          ./install.sh -y --shell
          sha256sum -c "$HOME/before.sha256"
          EOF

      - name: Run Debian shell and installer regressions
        run: |
          runuser -u tester -- sh -eu <<'EOF'
          export HOME=/home/tester
          export PATH=$HOME/.local/bin:$PATH
          export CHEZMOI_BIN=$HOME/.local/bin/chezmoi
          cd "$HOME/source"
          ./tests/shell.sh
          ./tests/shell-runtime.sh
          ./tests/integration.sh
          ./tests/lazygit.sh
          ./tests/combined-installation.sh
          ./tests/installer.sh
          ./tests/release.sh
          EOF
